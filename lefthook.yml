# lefthook configuration
# 取代 Vite+ 的 `vp config` 安装时注入 hook,改为单一版本受控配置;vue-vben-admin 子模块自带 lefthook.yml。
# Escape hatch: LEFTHOOK=0 git commit / git commit --no-verify
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    format:staged:
      run: pnpm exec vp staged
      stage_fixed: true
    lint:react-admin:
      # react-admin 不在根 workspace,单独跑 ESLint。
      root: "apps/react-admin/"
      glob: "**/*.{ts,tsx}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    typecheck:react-admin:
      # glob 限定 react-admin 路径,只在有暂存改动时触发。
      root: "apps/react-admin/"
      glob: "apps/react-admin/**/*.{ts,tsx}"
      run: pnpm typecheck
    cspell:staged:
      glob: "{apps/backend-mock-template/**/*.{ts,tsx},*.md,*.yml}"
      run: pnpm exec cspell lint --no-progress 'apps/backend-mock-template/**/*.ts' 'apps/backend-mock-template/**/*.tsx' '*.md' '*.yml'
    secret-scan:
      # exec 短路确保 gitleaks 失败退出码不被 echo 覆盖成 0;未装则 skip。
      run: sh -c 'command -v gitleaks >/dev/null 2>&1 && exec gitleaks protect --staged --redact --no-banner; echo skip:gitleaks-not-installed'
    format:java:
      # 先语义改写（lambda→方法引用），再 Spotless 格式化；Checkstyle 无法覆盖前者。
      glob: "backend/java-admin/**/src/{main,test}/java/**/*.java"
      run: mvn -B -q -f backend/java-admin/pom.xml rewrite:run spotless:apply
      stage_fixed: true

post-merge:
  parallel: true
  commands:
    deps:install:
      glob: "pnpm-lock.yaml"
      run: pnpm install --frozen-lockfile=false

pre-push:
  parallel: true
  commands:
    check:full:
      # 只读 check;--fix 改 working tree 但不进 commit,留给 pre-commit 的 stage_fixed。
      run: pnpm exec vp check
    lint:react-admin:
      root: "apps/react-admin/"
      glob: "apps/react-admin/**/*.{ts,tsx}"
      run: pnpm eslint {push_files}
    check:java-style:
      glob: "backend/java-admin/**/src/{main,test}/java/**/*.java"
      run: mvn -B -f backend/java-admin/pom.xml checkstyle:check
    check:java-method-ref:
      # 对齐 IDEA “Lambda can be replaced with method reference”；failOnDryRunResults=true
      glob: "backend/java-admin/**/src/{main,test}/java/**/*.java"
      run: mvn -B -f backend/java-admin/pom.xml rewrite:dryRun
    check:java-types:
      # WARN 不阻断,ERROR 阻断;`mvn verify` 也跑 compile 做安全网。
      glob: "backend/java-admin/**/src/{main,test}/java/**/*.java"
      run: mvn -B -q -f backend/java-admin/pom.xml -DskipTests compile

commit-msg:
  commands:
    commitlint:
      # vue-vben-admin 子目录 commit 时走自己的 .commitlintrc.js,根 commit 走 @commitlint/config-conventional。
      run: pnpm exec commitlint --edit "$1"
