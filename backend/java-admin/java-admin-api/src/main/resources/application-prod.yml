spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:4336}/${MYSQL_DB}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 32
      minimum-idle: 4

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:4379}
      # prod 必设密码（dev 默认 123456 不可用）
      password: ${REDIS_PASSWORD}
      timeout: 5s
      lettuce:
        pool:
          # prod 加大连接池
          max-active: 32
          max-idle: 16
          min-idle: 4

  # Flyway：prod 用 migration-prod；未配置 spring.flyway.target 时执行该目录全部版本
  flyway:
    locations: classpath:db/migration-prod

# Knife4j：prod 默认关（避免 API 文档泄露到公网）
knife4j:
  enable: ${KNIFE4J_ENABLE:false}

logging:
  # 格式（Logstash JSON）在 logback-spring.xml 的 prod|test profile；
  # 自定义 logback 时 logging.structured.format 不会自动生效。
  level:
    root: INFO
    com.wshake: INFO
