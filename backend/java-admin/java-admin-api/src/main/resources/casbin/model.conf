# jcasbin ACL 模型
# sub = 主体（用户 ID 字符串）
# obj = 资源（API 路径，支持 keyMatch2 通配符，如 /api/v1/users/:id）
# act = 动作（HTTP 方法：GET/POST/PUT/DELETE 等）

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && keyMatch2(r.obj, p.obj) && r.act == p.act