# ============================================================
# Qdrant 单节点（开发 / 演示）
# 位置：deploy/qdrant/docker-compose.yml
# 启动：docker compose --env-file .env.example up -d
# Dashboard：http://127.0.0.1:6333/dashboard
# REST：http://127.0.0.1:6333 ；gRPC：6334
# ============================================================

name: qdrant

networks:
  qdrant-net:
    driver: bridge

volumes:
  qdrant_storage:
  qdrant_snapshots:

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    hostname: qdrant
    restart: unless-stopped
    mem_limit: ${QDRANT_MEM_LIMIT:-1g}
    memswap_limit: ${QDRANT_MEM_LIMIT:-1g}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-changeme}
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - qdrant-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
