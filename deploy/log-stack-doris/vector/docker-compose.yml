# ============================================================
# Vector 采集端（部署在业务服务器）
# 位置：deploy/log-stack-doris/vector/docker-compose.yml
# 启动：docker compose --env-file .env.example up -d
# 本地联调加 --profile demo 会起日志发生器
# ============================================================

name: log-vector

volumes:
  vector_data:

services:
  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.49.0-debian}
    hostname: vector
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # FE Stream Load 会 307，Vector HTTP sink 不跟随 PUT，直连 BE
      DORIS_STREAM_LOAD_URI: http://${DORIS_BE_HOST:?set DORIS_BE_HOST}:${DORIS_BE_HTTP_PORT:-8040}/api/${DORIS_DATABASE:-log_db}/${DORIS_TABLE:-doris_log}/_stream_load
      DORIS_USER: ${DORIS_USER:-root}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VECTOR_API_PORT:-8686}:8686"
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
      - ${LOG_HOST_DIR:-./logs}:/var/log/app:ro
    command: ["--config", "/etc/vector/vector.yaml"]

  log-generator:
    profiles: ["demo"]
    image: alpine:3.21
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LOG_DIR: /var/log/app
      INTERVAL_SECS: "2"
    volumes:
      - ../log-generator/run.sh:/run.sh:ro
      - ${LOG_HOST_DIR:-./logs}:/var/log/app
    command: ["sh", "/run.sh"]
