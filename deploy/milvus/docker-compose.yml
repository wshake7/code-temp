# ============================================================
# Milvus Standalone（开发 / 演示）
# 位置：deploy/milvus/docker-compose.yml
# 启动：docker compose --env-file .env.example up -d
# WebUI：http://127.0.0.1:9091/webui/
# gRPC：127.0.0.1:19530
# 依据官方 standalone compose，数据改用 named volume（Windows Docker 更稳）
# ============================================================

name: milvus

networks:
  milvus-net:
    driver: bridge

volumes:
  etcd_data:
  minio_data:
  milvus_data:

services:
  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.25}
    hostname: etcd
    restart: unless-stopped
    mem_limit: ${ETCD_MEM_LIMIT:-256m}
    memswap_limit: ${ETCD_MEM_LIMIT:-256m}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - milvus-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-05-28T17-19-04Z}
    hostname: minio
    restart: unless-stopped
    mem_limit: ${MINIO_MEM_LIMIT:-256m}
    memswap_limit: ${MINIO_MEM_LIMIT:-256m}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - milvus-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v3.0.0}
    hostname: standalone
    restart: unless-stopped
    mem_limit: ${MILVUS_MEM_LIMIT:-2g}
    memswap_limit: ${MILVUS_MEM_LIMIT:-2g}
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    command: ["milvus", "run", "standalone"]
    ports:
      - "${MILVUS_GRPC_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - milvus-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
